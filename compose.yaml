services:
  grafana:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      DUCKLAKE_PASSWORD: ${DUCKLAKE_PASSWORD:-local-development}
    volumes:
      - grafana-data:/var/lib/grafana
      - lake-data:/var/lib/ducklake/data
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./examples:/etc/grafana/duckdb:ro
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ducklake
      POSTGRES_USER: ducklake
      POSTGRES_PASSWORD: ${DUCKLAKE_PASSWORD:-local-development}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ducklake -d ducklake"]
      interval: 2s
      timeout: 5s
      retries: 30
  ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: examples/ingest.Dockerfile
    user: "472:0"
    environment:
      DUCKLAKE_HOST: postgres
      DUCKLAKE_PASSWORD: ${DUCKLAKE_PASSWORD:-local-development}
    volumes:
      - lake-data:/var/lib/ducklake/data
    depends_on:
      postgres:
        condition: service_healthy
      grafana:
        condition: service_started

volumes:
  grafana-data:
  postgres-data:
  lake-data:

apiVersion: 1
datasources:
  - name: Local DuckDB
    uid: local-duckdb
    type: local-duckdb-datasource
    access: proxy
    isDefault: true
    jsonData:
      mode: duckdb-embedded
      path: /var/lib/grafana/duckdb/analytics.duckdb
      setupSqlPath: /etc/grafana/duckdb/setup.sql
      maxOpenConns: 4
      maxRows: 100000
      queryTimeout: 30
  - name: Local DuckLake
    uid: local-ducklake
    type: local-duckdb-datasource
    access: proxy
    jsonData:
      mode: ducklake
      postgresHost: postgres
      postgresPort: 5432
      postgresDatabase: ducklake
      postgresUser: ducklake
      postgresSslMode: disable
      dataPath: /var/lib/ducklake/data
      createDuckLake: true
      extensionDirectory: /opt/duckdb/extensions
      maxOpenConns: 4
      maxRows: 100000
      queryTimeout: 30
    secureJsonData:
      postgresPassword: $DUCKLAKE_PASSWORD
